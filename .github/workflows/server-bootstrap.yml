name: Server bootstrap

on:
  workflow_dispatch:

concurrency:
  group: assembly-os-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap:
    name: Prepare project storage only
    runs-on: ubuntu-24.04
    environment: prod
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USERNAME: ${{ vars.VPS_USERNAME || 'deploy' }}
      VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/opt/assembly-os' }}
      DB_NETWORK: ${{ vars.DB_NETWORK }}
      INGRESS_NETWORK: ${{ vars.INGRESS_NETWORK }}
      BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS || '14' }}
    steps:
      - name: Check out bootstrap sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate bootstrap settings
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_USERNAME" =~ ^[a-z_][a-z0-9_-]*$ && "$VPS_USERNAME" != root ]]
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_SSH_PORT" =~ ^[0-9]+$ ]] && (( VPS_SSH_PORT >= 1 && VPS_SSH_PORT <= 65535 ))
          [[ "$DEPLOY_ROOT" == /opt/assembly-os ]]
          [[ "$BACKUP_RETENTION_DAYS" =~ ^[0-9]+$ ]] && (( BACKUP_RETENTION_DAYS >= 1 && BACKUP_RETENTION_DAYS <= 365 ))
          awk '
            /^#/ || NF == 0 { next }
            $1 !~ /^[0-9a-f]{64}$/ || $2 !~ /^[A-Za-z0-9._-]+$/ || $3 !~ /^https:\/\// { exit 1 }
            { count++ }
            END { if (count != 2) exit 1 }
          ' models/checksums.tsv

      - name: Render root-readable runtime configuration
        shell: bash
        env:
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NETWORK: ${{ vars.DB_NETWORK }}
          INGRESS_NETWORK: ${{ vars.INGRESS_NETWORK }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_NOTIFY_SECRET: ${{ secrets.BOT_NOTIFY_SECRET }}
          DEV_PANEL_KEY: ${{ secrets.DEV_PANEL_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          ADMIN_LOGIN: ${{ vars.ADMIN_LOGIN || 'admin' }}
          ADMIN_IDS: ${{ vars.ADMIN_IDS }}
          CRM_ADMIN_LOGINS: ${{ vars.CRM_ADMIN_LOGINS }}
          NEXT_PUBLIC_TIME_ZONE: ${{ vars.NEXT_PUBLIC_TIME_ZONE || 'Asia/Tashkent' }}
          DEV_PANEL_ENABLED: ${{ vars.DEV_PANEL_ENABLED || '0' }}
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/assembly-os-runtime"
          python3 scripts/render-env.py --service backend --output "$runtime"
          find "$runtime" -type f ! -perm 0600 -print -quit | grep -q . && exit 1 || true

      - name: Configure pinned deployment SSH access
        id: ssh
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/assembly-os-bootstrap-key"
          known_hosts="$RUNNER_TEMP/assembly-os-known-hosts"
          install -m 0600 /dev/null "$key"
          printf '%s\n' "$VPS_SSH_KEY" > "$key"
          printf '%s\n' "$VPS_SSH_HOST_KEY" > "$known_hosts"
          chmod 0600 "$key" "$known_hosts"
          ssh-keygen -l -f "$known_hosts" >/dev/null
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "known_hosts=$known_hosts" >> "$GITHUB_OUTPUT"

      - name: Provision the server idempotently
        id: provision
        shell: bash
        env:
          SSH_KEY: ${{ steps.ssh.outputs.key }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
        run: |
          set -euo pipefail
          ssh_args=(-i "$SSH_KEY" -p "$VPS_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS" -o ConnectTimeout=15)
          remote="$VPS_USERNAME@$VPS_HOST"
          remote_stage="/tmp/assembly-os-bootstrap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "$remote" "sudo -n true && install -d -m 0700 '$remote_stage'"
          cleanup_remote() {
            # shellcheck disable=SC2029
            ssh "${ssh_args[@]}" "$remote" "sudo -n rm -rf -- '$remote_stage'" >/dev/null 2>&1 || true
          }
          trap cleanup_remote EXIT
          rsync_ssh="ssh -i $SSH_KEY -p $VPS_SSH_PORT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN_HOSTS"
          rsync -az -e "$rsync_ssh" models scripts systemd "$remote:$remote_stage/"
          rsync -az -e "$rsync_ssh" "$RUNNER_TEMP/assembly-os-runtime/" "$remote:$remote_stage/config/"
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "$remote" \
            "sudo -n bash '$remote_stage/scripts/bootstrap.sh' '$DEPLOY_ROOT' '$VPS_SSH_PORT' false '$remote_stage' '$BACKUP_RETENTION_DAYS' '$VPS_USERNAME'"

      - name: Verify the deployable host
        shell: bash
        env:
          SSH_KEY: ${{ steps.ssh.outputs.key }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
        run: |
          set -euo pipefail
          ssh -i "$SSH_KEY" -p "$VPS_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS" \
            "$VPS_USERNAME@$VPS_HOST" \
            "sudo -n docker info >/dev/null && sudo -n docker compose version >/dev/null && test -d '$DEPLOY_ROOT/.staging'"
