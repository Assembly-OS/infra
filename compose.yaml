name: assembly-os

x-service-defaults: &service-defaults
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  networks:
    - app

services:
  backend:
    <<: *service-defaults
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    user: "10001:10001"
    env_file:
      - /etc/assembly-os/backend.env
    volumes:
      - /var/lib/assembly-os/data:/data
      - /var/lib/assembly-os/models:/models:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,uid=10001,gid=10001
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  frontend:
    <<: *service-defaults
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    user: "10001:10001"
    env_file:
      - /etc/assembly-os/frontend.env
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - /var/lib/assembly-os/data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  bot:
    <<: *service-defaults
    image: ${BOT_IMAGE:?BOT_IMAGE is required}
    user: "10001:10001"
    env_file:
      - /etc/assembly-os/bot.env
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - /var/lib/assembly-os/data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 5

  caddy:
    <<: *service-defaults
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    user: "10001:10001"
    cap_add:
      - NET_BIND_SERVICE
    env_file:
      - /etc/assembly-os/caddy.env
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/assembly-os/caddy/data:/data
      - /var/lib/assembly-os/caddy/config:/config
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001
    healthcheck:
      test: [CMD, caddy, version]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  app:
    driver: bridge
